/* 表格样式 */
.table-view { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: table; }
.table-view.hidden { display: none; }
.table-view th { background: #1e3a5f; color: #fff; padding: 12px 16px; text-align: left; font-weight: 600; font-size: 13px; }
.table-view td { padding: 12px 16px; border-bottom: 1px solid #f0f4f8; font-size: 13px; }
.table-view tr:hover td { background: #f8fafc; }
.table-view a { color: #2b6cb0; text-decoration: none; font-weight: 500; }
.table-view a:hover { text-decoration: underline; }
.table-view .name-zh { font-weight: 600; color: #1e3a5f; }
.table-view .name-en { font-size: 11px; color: #718096; }
/* 卡片样式 */
.card-view { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; display: grid; }
.card-view.hidden { display: none; }
.card { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.2s; text-decoration: none; color: inherit; display: block; }
.card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
.card h3 { font-size: 15px; color: #1e3a5f; margin-bottom: 4px; font-weight: 600; }
.card .en-name { font-size: 11px; color: #718096; margin-bottom: 8px; }
.card .addr { font-size: 11px; color: #a0aec0; margin-bottom: 8px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { display: inline-block; background: #e6f0fa; color: #2b6cb0; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
.tag.dist { background: #f0fff4; color: #2f855a; }
.tag.fin { background: #fef5e7; color: #c05621; }
.highlight { background: #fff3cd; padding: 0 2px; border-radius: 2px; }
.no-result { text-align: center; padding: 60px 20px; color: #718096; background: #fff; border-radius: 10px; }
footer { background: #1a202c; color: rgba(255,255,255,0.6); padding: 32px 20px 20px; text-align: center; margin-top: 48px; font-size: 13px; }
footer a { color: rgba(255,255,255,0.8); text-decoration: none; margin: 0 8px; }
@media (max-width: 900px) { .card-view { grid-template-columns: repeat(2, 1fr); } .table-view { font-size: 12px; } .table-view th, .table-view td { padding: 8px 10px; } }
@media (max-width: 600px) { .card-view { grid-template-columns: 1fr; } .nav-links { display: none; } .table-view th:nth-child(4), .table-view td:nth-child(4) { display: none; } }
</style>

<script src=search-data-full.js></script>
<script>
var levelNames = {
    'KINDERGARTEN': '幼稚園',
    'KINDERGARTEN-CUM-CHILD CARE CENTRES': '幼稚園暨幼兒中心',
    'PRIMARY': '小學',
    'SECONDARY': '中學'
};
var districtNames = {
    'CENTRAL AND WESTERN': '中西區',
    'EASTERN': '東區',
    'ISLANDS': '離島區',
    'KOWLOON CITY': '九龍城區',
    'KWAI TSING': '葵青區',
    'KWUN TONG': '觀塘區',
    'NORTH': '北區',
    'SAI KUNG': '西貢區',
    'SHAM SHUI PO': '深水埗區',
    'SHA TIN': '沙田區',
    'SOUTHERN': '南區',
    'TAI PO': '大埔區',
    'TSUEN WAN': '荃灣區',
    'TUEN MUN': '屯門區',
    'WAN CHAI': '灣仔區',
    'WONG TAI SIN': '黃大仙區',
    'YAU TSIM MONG': '油尖旺區',
    'YUEN LONG': '元朗區'
};
var financeNames = {
    'AIDED': '資助',
    'CAPUT': '按額津貼',
    'DIRECT SUBSIDY SCHEME': '直接資助計劃',
    'ENGLISH SCHOOLS FOUNDATION': '英基學校協會',
    'GOVERNMENT': '官立',
    'PRIVATE': '私立',
    'PRIVATE INDEPENDENT SCH SCHEME': '私立獨立學校計劃'
};
var currentView = 'table';
var searchTimeout = null;

function highlight(text, query) {
    if (!query) return text;
    var lowerText = text.toLowerCase();
    var lowerQuery = query.toLowerCase();
    var idx = lowerText.indexOf(lowerQuery);
    if (idx === -1) return text;
    return text.substring(0, idx) + '<span class="highlight">' + text.substring(idx, idx + query.length) + '</span>' + text.substring(idx + query.length);
}

function renderTable(schools, query) {
    var tbody = document.getElementById('table-body');
    var html = '';
    for (var i = 0; i < schools.length && i < 500; i++) {
        var s = schools[i];
        html += '<tr><td><a href="schools/' + s.id + '.html">';
        html += '<div class="name-zh">' + highlight(s.name_zh, query) + '</div>';
        html += '<div class="name-en">' + highlight(s.name_en, query) + '</div>';
        html += '</a></td>';
        html += '<td>' + levelNames[s.level] + '</td>';
        html += '<td>' + districtNames[s.district] + '</td>';
        html += '<td>' + financeNames[s.finance] + '</td>';
        html += '<td>' + highlight(s.address_zh, query) + '</td></tr>';
    }
    if (schools.length > 500) {
        html += '<tr><td colspan="5" style="text-align:center;color:#718096;font-size:12px;">顯示前 500 筆結果，請輸入更多關鍵字縮小範圍</td></tr>';
    }
    tbody.innerHTML = html;
}

function renderCards(schools, query) {
    var container = document.getElementById('card-view');
    var html = '';
    for (var i = 0; i < schools.length && i < 200; i++) {
        var s = schools[i];
        html += '<a href="schools/' + s.id + '.html" class="card">';
        html += '<h3>' + highlight(s.name_zh, query) + '</h3>';
        html += '<div class="en-name">' + highlight(s.name_en, query) + '</div>';
        html += '<div class="addr">' + highlight(s.address_zh, query) + '</div>';
        html += '<div class="tags"><span class="tag dist">' + districtNames[s.district] + '</span>';
        html += '<span class="tag">' + levelNames[s.level] + '</span>';
        html += '<span class="tag fin">' + financeNames[s.finance] + '</span></div>';
        html += '</a>';
    }
    if (schools.length > 200) {
        html += '<div class="card" style="text-align:center;color:#718096;font-size:12px;">顯示前 200 筆結果，請輸入更多關鍵字縮小範圍</div>';
    }
    container.innerHTML = html;
}

function doSearch() {
    var query = document.getElementById('search-input').value.trim();
    var levelFilter = document.getElementById('filter-level').value;
    var districtFilter = document.getElementById('filter-district').value;
    var financeFilter = document.getElementById('filter-finance').value;
    
    var results = allSchools.filter(function(s) {
        if (levelFilter && s.level !== levelFilter) return false;
        if (districtFilter && s.district !== districtFilter) return false;
        if (financeFilter && s.finance !== financeFilter) return false;
        if (!query) return true;
        var lowerQuery = query.toLowerCase();
        return s.name_zh.indexOf(query) !== -1 ||
               s.name_en.toLowerCase().indexOf(lowerQuery) !== -1 ||
               s.address_zh.indexOf(query) !== -1 ||
               s.address_en.toLowerCase().indexOf(lowerQuery) !== -1;
    });
    
    document.getElementById('result-count').textContent = results.length;
    
    var noResult = document.getElementById('no-result');
    var tableView = document.getElementById('table-view');
    var cardView = document.getElementById('card-view');
    
    if (results.length === 0) {
        noResult.style.display = 'block';
        tableView.style.display = 'none';
        cardView.style.display = 'none';
    } else {
        noResult.style.display = 'none';
        if (currentView === 'table') {
            tableView.style.display = 'table';
            cardView.style.display = 'none';
            renderTable(results, query);
        } else {
            tableView.style.display = 'none';
            cardView.style.display = 'grid';
            renderCards(results, query);
        }
    }
}

function setView(view) {
    currentView = view;
    document.querySelectorAll('.view-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.view === view);
    });
    doSearch();
}

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('search-input').addEventListener('input', function() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(doSearch, 150);
    });
    document.getElementById('filter-level').addEventListener('change', doSearch);
    document.getElementById('filter-district').addEventListener('change', doSearch);
    document.getElementById('filter-finance').addEventListener('change', doSearch);
    document.querySelectorAll('.view-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            setView(this.dataset.view);
        });
    });
    doSearch();
});
</script>
