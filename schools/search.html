<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学校搜寻 | 香港学校数据库</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: #f5f7fa; color: #2d3748; line-height: 1.6; }
header { background: linear-gradient(135deg, #1e3a5f, #2d5a87); color: #fff; }
.hdr { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
.logo { font-size: 18px; font-weight: 700; color: #fff; text-decoration: none; }
.logo span { color: #ffd43b; }
.nav-links { display: flex; gap: 4px; list-style: none; }
.nav-links a { color: rgba(255,255,255,0.9); text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
.search-bar { background: linear-gradient(135deg, #1e3a5f, #2d5a87); padding: 20px; text-align: center; }
.search-bar input { width: 100%; max-width: 600px; padding: 12px 16px; border: none; border-radius: 8px; font-size: 15px; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
th { background: #1e3a5f; color: #fff; padding: 12px 16px; text-align: left; font-size: 13px; }
td { padding: 12px 16px; border-bottom: 1px solid #f0f4f8; font-size: 13px; }
tr:hover td { background: #f8fafc; }
td a { color: #2b6cb0; text-decoration: none; font-weight: 500; }
.name-zh { font-weight: 600; color: #1e3a5f; }
.name-en { font-size: 11px; color: #718096; }
footer { background: #1a202c; color: rgba(255,255,255,0.6); padding: 32px 20px 20px; text-align: center; margin-top: 48px; font-size: 13px; }
footer a { color: rgba(255,255,255,0.8); text-decoration: none; margin: 0 8px; }
@media (max-width: 768px) { .nav-links { display: none; } }
</style>
</head>
<body>
<header><div class="hdr">
<a href="index.html" class="logo">HK<span>Schools</span> 全港学校资料</a>
<nav class="nav-links">
<a href="index.html#level">学校类别</a>
<a href="index.html#district">地区分类</a>
</nav></div></header>

<div class="search-bar">
<input type="text" id="search-input" placeholder="输入学校名称（中文或英文）开始搜索...">
</div>

<div class="container">
<table>
<thead>
<tr>
<th>学校名称</th>
<th>类别</th>
<th>地区</th>
<th>地址</th>
</tr>
</thead>
<tbody id="school-list">
</tbody>
</table>
</div>

<footer>
<p style="margin-bottom:12px;"><a href="index.html">首页</a> | <a href="#">关于我们</a> | <a href="#">隐私政策</a></p>
<p style="margin-bottom:8px;">资料来源：香港教育局 (EDB)</p>
<p>&copy; 2026 HK Schools 香港学校数据库</p>
</footer>

<script src="search-data-full.js"></script>
<script>
var levelNames = { "KINDERGARTEN":"幼稚园", "KINDERGARTEN-CUM-CHILD CARE CENTRES":"幼稚园暨幼儿中心", "PRIMARY":"小学", "SECONDARY":"中学" };
var districtNames = { "CENTRAL AND WESTERN":"中西区", "EASTERN":"东区", "ISLANDS":"离岛区", "KOWLOON CITY":"九龙城区", "KWAI TSING":"葵青区", "KWUN TONG":"观塘区", "NORTH":"北区", "SAI KUNG":"西贡区", "SHAM SHUI PO":"深水埗区", "SHA TIN":"沙田区", "SOUTHERN":"南区", "TAI PO":"大埔区", "TSUEN WAN":"荃湾区", "TUEN MUN":"屯门区", "WAN CHAI":"湾仔区", "WONG TAI SIN":"黄大仙区", "YAU TSIM MONG":"油尖旺区", "YUEN LONG":"元朗区" };

var searchTimeout = null;

function render(schools, query) {
    var html = "";
    for (var i = 0; i < schools.length && i < 300; i++) {
        var s = schools[i];
        html += '<tr><td><a href="schools/' + s.id + '.html">' + 
                '<div class="name-zh">' + s.name_zh + '</div>' +
                '<div class="name-en">' + s.name_en + '</div></a></td>' +
                '<td>' + levelNames[s.level] + '</td>' +
                '<td>' + districtNames[s.district] + '</td>' +
                '<td>' + s.address_zh + '</td></tr>';
    }
    document.getElementById("school-list").innerHTML = html;
}

function doSearch() {
    var query = document.getElementById("search-input").value.trim();
    if (!query) { render(allSchools.slice(0, 200), ""); return; }
    
    var q = query.toLowerCase();
    var results = allSchools.filter(function(s) {
        return s.name_zh.indexOf(query) !== -1 || 
               s.name_en.toLowerCase().indexOf(q) !== -1 ||
               s.address_zh.indexOf(query) !== -1;
    });
    render(results, query);
}

document.getElementById("search-input").addEventListener("input", function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(doSearch, 200);
});

// 初始显示前200所
render(allSchools.slice(0, 200), "");
</script>
</body>
</html>
